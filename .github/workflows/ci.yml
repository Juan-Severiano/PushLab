name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build unsigned Release configuration
        run: >-
          xcodebuild
          -project PushLab.xcodeproj
          -scheme PushLab
          -configuration Release
          -destination 'generic/platform=macOS'
          build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
